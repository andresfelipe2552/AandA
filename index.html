<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .mensaje {
      padding: 20px;
      opacity: 0.9;
    }

    .mensaje .titulo {
      font-size: clamp(24px, 5vw, 40px);
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .mensaje .linea {
      width: 80px;
      height: 1px;
      background: rgba(255, 255, 255, 0.5);
      margin: 25px auto;
    }

    .mensaje .sub {
      font-size: clamp(13px, 2vw, 17px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="mensaje">
    <p class="titulo">Próximamente</p>
    <div class="linea"></div>
    <p class="sub">Estamos preparando algo especial</p>
  </div>
</body>
</html>
