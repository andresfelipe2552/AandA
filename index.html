<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .calavera {
      font-size: clamp(90px, 22vw, 200px);
      line-height: 1;
      animation: flotar 3s ease-in-out infinite;
    }

    .titulo {
      margin-top: 30px;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .sub {
      margin-top: 14px;
      font-size: clamp(12px, 2vw, 16px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.9;
      }
      50% {
        transform: translateY(-14px);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div>
    <div class="calavera">💀</div>
    <p class="titulo">Próximamente</p>
    <p class="sub">Estamos preparando algo especial</p>
  </div>
</body>
</html>
