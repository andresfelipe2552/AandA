<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background:
        radial-gradient(
          ellipse at 50% 110%,
          rgba(255, 255, 255, 0.08),
          transparent 55%
        ),
        radial-gradient(
          ellipse at 50% -10%,
          rgba(255, 255, 255, 0.05),
          transparent 55%
        ),
        #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .cargando {
      display: inline-block;
      font-size: clamp(70px, 16vw, 130px);
      line-height: 1;
      color: #f5f5f5;
      text-shadow:
        0 0 25px rgba(255, 255, 255, 0.6),
        0 0 70px rgba(255, 255, 255, 0.3);
      filter: drop-shadow(0 8px 30px rgba(255, 255, 255, 0.25));
      animation: girarSuave 1.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes girarSuave {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.06);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="cargando" aria-label="Cargando">⟳</div>
</body>
</html>
